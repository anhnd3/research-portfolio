project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!index.qmd"
  resources:
    - index.html
    - googlef3637ee6fdc70f85.html
    - articles/compact-domain-reranking/index.html
    - articles/vision-transformers-facial-expression-recognition/index.html
    - articles/gdem-graph-distillation-reproduction/index.html
    - articles/verified-counterfactual-explanations-ufce-ff/index.html
    - assets/research-reranking-og.png
    - assets/research-gdem-og.png
    - assets/research-ufce-og.png
    - assets/research-vit-og.png
    - about/index.html
    - llms.txt
    - 1f9f8234dd9f1af7f9c9942ea0399497.txt

website:
  title: "Aiden | Research Portfolio"
  site-url: "https://anhnd3.github.io/research-portfolio/"
  image: assets/research-reranking-og.png
  image-alt: "Aiden research portfolio"
  description: "Research on compact AI reranking, computer vision and explainable AI, with empirical comparisons and documented limitations."
  navbar:
    title: "Aiden"
    background: "#15221d"
    foreground: "#f4f1e6"
    left:
      - text: "Research"
        href: index.html#research
      - text: "About"
        href: about/index.html
      - text: "Publication policy"
        href: index.html#policy
    right:
      - icon: github
        aria-label: "GitHub repository"
        href: "https://github.com/anhnd3/research-portfolio"
  page-footer:
    left: "© 2026 Aiden · Independent research notes"
    right:
      - text: "Publication policy"
        href: policy.qmd
      - text: "Source"
        href: "https://github.com/anhnd3/research-portfolio"
  search: true
  open-graph: true
  twitter-card: true
  repo-url: "https://github.com/anhnd3/research-portfolio"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    smooth-scroll: true
    anchor-sections: true
    code-copy: true
    mainfont: "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    monofont: "ui-monospace, SFMono-Regular, Consolas, monospace"
    link-external-newwindow: true

execute:
  freeze: auto
