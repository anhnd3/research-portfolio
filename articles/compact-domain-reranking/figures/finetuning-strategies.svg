<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc" viewBox="0 0 980 330"><title id="ttl">Direct and sequential fine tuning strategies</title><desc id="desc">Direct fine tuning adapts pretrained reranker to supervised relevance. Sequential adds intermediate domain adaptation before supervised relevance training.</desc><rect width="980" height="330" rx="14" fill="#fff"/><text x="45" y="45" fill="#54687f" font-size="17" font-family="Arial" font-weight="bold">Direct FT</text><rect x="130" y="65" width="260" height="65" rx="10" fill="#edf4fd" stroke="#bdd1e7"/><text x="260" y="104" text-anchor="middle" fill="#173951" font-size="17" font-family="Arial">Pretrained reranker</text><line x1="402" y1="98" x2="578" y2="98" stroke="#7d94aa" stroke-width="3"/><path d="M568,91 L578,98 L568,105" stroke="#7d94aa" stroke-width="3" fill="none"/><rect x="590" y="65" width="280" height="65" rx="10" fill="#e6f4f1" stroke="#81c9bd"/><text x="730" y="104" text-anchor="middle" fill="#173951" font-size="17" font-family="Arial">Relevance training</text><text x="45" y="175" fill="#54687f" font-size="17" font-family="Arial" font-weight="bold">Sequential FT</text><rect x="80" y="195" width="220" height="65" rx="10" fill="#edf4fd" stroke="#bdd1e7"/><text x="190" y="234" text-anchor="middle" fill="#173951" font-size="17" font-family="Arial">Pretrained reranker</text><line x1="312" y1="228" x2="363" y2="228" stroke="#7d94aa" stroke-width="3"/><path d="M353,221 L363,228 L353,235" stroke="#7d94aa" stroke-width="3" fill="none"/><rect x="375" y="195" width="220" height="65" rx="10" fill="#edf4fd" stroke="#bdd1e7"/><text x="485" y="234" text-anchor="middle" fill="#173951" font-size="17" font-family="Arial">Domain adaptation</text><line x1="607" y1="228" x2="658" y2="228" stroke="#7d94aa" stroke-width="3"/><path d="M648,221 L658,228 L648,235" stroke="#7d94aa" stroke-width="3" fill="none"/><rect x="670" y="195" width="225" height="65" rx="10" fill="#e6f4f1" stroke="#81c9bd"/><text x="782.5" y="234" text-anchor="middle" fill="#173951" font-size="17" font-family="Arial">Relevance training</text></svg>